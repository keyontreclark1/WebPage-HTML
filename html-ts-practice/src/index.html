<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>HTML Practice</title>
        <script src="app.js" defer></script>
        <link rel="stylesheet" href="styles/style.css">
        </head>

    <!-- Problem 1: Click Counter -->
    <div id="counterDisplay">Counter: 0</div>
    <button id="increaseButton">+1</button>
    <button id="decreaseButton">-1</button>
    <button id="increaseByFiveButton">+5</button>

    <hr>

    <!-- Problem 2: Circle Calculator -->
    <input type="number" id="radiusInput" placeholder="Radius">
    <button id="calculateButton">Calculate</button>
    <div id="areaDisplay">Area: </div>
    <div id="circumferenceDisplay">Circumference: </div>

    <hr>

    <!-- Problem 3: Countdown Timer -->
    <input type="number" id="countdownInput" placeholder="Seconds">
    <button id="countdownButton">Start Countdown</button>
    <div id="countdownDisplay">Countdown: </div>

    <!-- Ensure this points to app.js, NOT app.ts -->
    <script src="app.js" defer></script>
</body>
</html>
